name: ICT Scanner 10 Minute Auto Scan

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ict-scanner-scheduled
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Send Telegram test message on manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.telegram_chat_id || secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "BOT_TOKEN or telegram_chat_id secret is missing"
            exit 1
          fi
          curl --fail --silent --show-error -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" -d "chat_id=${CHAT_ID}" --data-urlencode "text=🧪 ICT Scanner TEST message from GitHub Actions. Telegram connection is working. Time: $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Scan markets and send Telegram alerts
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.telegram_chat_id || secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}
          GITHUB_ACTIONS: "true"
        run: python main.py
